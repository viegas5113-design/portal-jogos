<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo de Pong</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hud {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 16px;
      flex-wrap: wrap;
    }
    .mode-btn {
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 12px;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      max-width: 640px;
      height: auto;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 3px solid #f8fafc;
      border-radius: 14px;
      touch-action: none;
    }
    .touch-row {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .pad-group {
      display: flex;
      gap: 8px;
      flex: 1;
    }
    .pad-btn {
      flex: 1;
      min-height: 54px;
      border: none;
      border-radius: 14px;
      background: #334155;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
    }
    .pad-btn:active { background: #38bdf8; color: #0f172a; }
  </style>
</head>
<body>
  <div class="hud">
    <span>Jogador A: <strong id="scoreA" style="color:#38bdf8;">0</strong></span>
    <button id="btnMode" class="mode-btn">Modo: 1 Jogador (vs IA)</button>
    <span>Jogador B: <strong id="scoreB" style="color:#fbbf24;">0</strong></span>
  </div>

  <canvas id="pongCanvas" width="640" height="480"></canvas>

  <div class="touch-row">
    <div class="pad-group">
      <button id="btnAUp" class="pad-btn">⬆️ A</button>
      <button id="btnADown" class="pad-btn">⬇️ A</button>
    </div>
    <div class="pad-group" id="padBGroup" style="display:none;">
      <button id="btnBUp" class="pad-btn">⬆️ B</button>
      <button id="btnBDown" class="pad-btn">⬇️ B</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');
    const scoreAEl = document.getElementById('scoreA');
    const scoreBEl = document.getElementById('scoreB');
    const btnMode = document.getElementById('btnMode');
    const padBGroup = document.getElementById('padBGroup');

    let twoPlayers = false;
    let scoreA = 0;
    let scoreB = 0;

    const paddleW = 14;
    const paddleH = 92;
    const padA = { x: 20, y: 194, dy: 0 };
    const padB = { x: canvas.width - 34, y: 194, dy: 0 };
    const ball = { x: 320, y: 240, r: 9, dx: 4.5, dy: 3.5 };

    btnMode.addEventListener('click', () => {
      twoPlayers = !twoPlayers;
      btnMode.textContent = twoPlayers ? 'Modo: 2 Jogadores' : 'Modo: 1 Jogador (vs IA)';
      padBGroup.style.display = twoPlayers ? 'flex' : 'none';
      scoreA = 0; scoreB = 0;
      scoreAEl.textContent = '0';
      scoreBEl.textContent = '0';
      resetBall(1);
    });

    function resetBall(dir) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = 4.5 * dir;
      ball.dy = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 2);
    }

    function bindHold(id, target, val) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); target.dy = val; });
      el.addEventListener('pointerup', () => { target.dy = 0; });
      el.addEventListener('pointercancel', () => { target.dy = 0; });
      el.addEventListener('pointerleave', () => { target.dy = 0; });
    }
    bindHold('btnAUp', padA, -6);
    bindHold('btnADown', padA, 6);
    bindHold('btnBUp', padB, -6);
    bindHold('btnBDown', padB, 6);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') padA.dy = -6;
      if (e.key === 's' || e.key === 'S') padA.dy = 6;
      if (e.key === 'ArrowUp') (twoPlayers ? padB : padA).dy = -6;
      if (e.key === 'ArrowDown') (twoPlayers ? padB : padA).dy = 6;
    });
    window.addEventListener('keyup', (e) => {
      if (['w', 'W', 's', 'S'].includes(e.key)) padA.dy = 0;
      if (['ArrowUp', 'ArrowDown'].includes(e.key)) (twoPlayers ? padB : padA).dy = 0;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (e.buttons === 0 && e.pointerType === 'mouse') return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height) - paddleH / 2;
      const clamped = Math.max(0, Math.min(canvas.height - paddleH, y));
      if (!twoPlayers || x < canvas.width / 2) {
        padA.y = clamped;
      } else {
        padB.y = clamped;
      }
    });

    function loop() {
      padA.y = Math.max(0, Math.min(canvas.height - paddleH, padA.y + padA.dy));
      if (twoPlayers) {
        padB.y = Math.max(0, Math.min(canvas.height - paddleH, padB.y + padB.dy));
      } else {
        const targetY = ball.y - paddleH / 2;
        if (padB.y + 4 < targetY) padB.y += 3.8;
        else if (padB.y - 4 > targetY) padB.y -= 3.8;
        padB.y = Math.max(0, Math.min(canvas.height - paddleH, padB.y));
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.dy *= -1;
      }

      if (ball.x - ball.r <= padA.x + paddleW && ball.x > padA.x && ball.y >= padA.y && ball.y <= padA.y + paddleH && ball.dx < 0) {
        ball.dx *= -1.04;
      }
      if (ball.x + ball.r >= padB.x && ball.x < padB.x + paddleW && ball.y >= padB.y && ball.y <= padB.y + paddleH && ball.dx > 0) {
        ball.dx *= -1.04;
      }

      if (ball.x < 0) {
        scoreB++;
        scoreBEl.textContent = String(scoreB);
        resetBall(1);
      } else if (ball.x > canvas.width) {
        scoreA++;
        scoreAEl.textContent = String(scoreA);
        resetBall(-1);
      }

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(padA.x, padA.y, paddleW, paddleH);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(padB.x, padB.y, paddleW, paddleH);

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
