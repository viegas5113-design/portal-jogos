<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle Magnético do Avô (Versão Grande)</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            /* Impede scrolling acidental e seleção de texto ao arrastar pecas */
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { color: #f1c40f; margin-bottom: 5px; font-size: 34px; }
        p { font-size: 16px; margin-top: 0; color: #ecf0f1; margin-bottom: 20px; }
        
        #caixa-carregar {
            margin-bottom: 25px;
        }
        .botao-mestre {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #e67e22;
            color: white;
            border: 3px solid #d35400;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        .botao-mestre:hover { background-color: #d35400; }
        
        #input-imagem { display: none; }

        /* --- TAMANHO DO CONTENTOR PRINCIPAL ADAPTÁVEL --- */
        #escala-wrap {
            margin: 0 auto;
            display: none;
            overflow: visible;
        }
        #jogo-container {
            position: relative;
            /* Largura total maior: Zona Pecas (400) + Espaço (30) + Tabuleiro (880) + Margem(20) */
            width: 1330px; 
            height: 720px; /* Aumentado para acomodar o tabuleiro mais alto */
            transform-origin: top left;
            background-color: #34495e;
            border: 4px solid #f1c40f;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: block;
            overflow: hidden; /* Garante que nada sai do contentor */
        }

        /* --- ZONA DE PEÇAS SOLTAS --- */
        #zona-pecas {
            position: absolute;
            top: 30px;
            left: 20px;
            width: 380px;
            height: 660px; /* Aumentado */
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px dashed #7f8c8d;
            border-radius: 10px;
        }
        .etiqueta {
            position: absolute; top: -25px; left: 0; width: 100%; text-align: center;
            font-weight: bold; color: #bdc3c7; font-size: 18px;
        }

        /* --- O MOLDE (ONDE A IMAGEM VAI FICAR) --- */
        /* Novo tamanho da imagem final: (4 colunas * 220px) x (3 linhas * 220px) = 880x660 */
        #molde-tabuleiro {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 880px; /* 4 * 220 */
            height: 660px; /* 3 * 220 */
            background-color: #ecf0f1;
            border: 3px solid #95a5a6;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            /* Grelha de fundo ajustada para 220px */
            background-image: 
                linear-gradient(to right, #bdc3c7 1px, transparent 1px),
                linear-gradient(to bottom, #bdc3c7 1px, transparent 1px);
            background-size: 220px 220px; 
        }

        /* --- A PEÇA INDIVIDUAL (AUMENTADA) --- */
        .peca {
            position: absolute;
            width: 220px;  /* Aumentado de 150 */
            height: 220px; /* Aumentado de 150 */
            /* O background-size deve coincidir com o tamanho total da imagem final */
            background-size: 880px 660px; 
            border: 1px solid white;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            cursor: grab;
            z-index: 10;
            border-radius: 5px;
            transition: transform 0.1s;
            /* Garante boa qualidade de imagem ao redimensionar */
            image-rendering: high-quality; 
        }
        .peca:active { cursor: grabbing; transform: scale(1.05); }

        #mensagem-vitoria {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(46, 204, 113, 0.95);
            padding: 40px; border-radius: 20px; border: 5px solid white;
            font-size: 50px; font-weight: bold; color: white;
            display: none; z-index: 1000;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            text-align: center;
            animation: saltar 0.5s ease-out;
        }

        @keyframes saltar {
            0% { transform: translate(-50%, -50%) scale(0); }
            80% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <h1>O Grande Puzzle do Avô 🧩</h1>
    <p>Clica no botão para escolher qualquer imagem e começar a construir!</p>

    <div id="caixa-carregar">
        <label for="input-imagem" class="botao-mestre">📸 Escolher Imagem</label>
        <input type="file" id="input-imagem" accept="image/*">
    </div>

    <div id="escala-wrap">
    <div id="jogo-container">
        <div id="zona-pecas">
            <div class="etiqueta">As Peças Soltas</div>
        </div>
        <div id="molde-tabuleiro">
            <div class="etiqueta" style="top: -25px; color: #f1c40f;">Montar Aqui</div>
        </div>
        <div id="mensagem-vitoria">PARABÉNS!<br><span style="font-size:30px">O Puzzle está perfeito!</span></div>
    </div>
    </div>

    <script>
        let escalaJogo = 1;
        function ajustarEscalaPuzzle() {
            const wrap = document.getElementById('escala-wrap');
            const cont = document.getElementById('jogo-container');
            const dispW = Math.max(280, window.innerWidth - 24);
            const dispH = Math.max(220, window.innerHeight - 170);
            escalaJogo = Math.min(1, dispW / 1330, dispH / 720);
            cont.style.transform = `scale(${escalaJogo})`;
            wrap.style.width = Math.round(1330 * escalaJogo) + 'px';
            wrap.style.height = Math.round(720 * escalaJogo) + 'px';
        }
        window.addEventListener('resize', ajustarEscalaPuzzle);
        // CONFIGURAÇÃO DO PUZZLE (Ajustada para o novo tamanho)
        const colunas = 4;
        const linhas = 3;
        const larguraPeca = 220; // Aumentado de 150
        const alturaPeca = 220;   // Aumentado de 150
        
        const totalPecas = colunas * linhas; 
        
        let pecasEncaixadas = 0;
        let magnetismoAtivado = false; 

        // 1. GESTÃO DO CARREGAMENTO DA IMAGEM
        document.getElementById('input-imagem').addEventListener('change', function(evento) {
            const ficheiro = evento.target.files[0];
            if (ficheiro) {
                const urlImagem = URL.createObjectURL(ficheiro);
                iniciarPuzzle(urlImagem);
            }
        });

        // 2. INICIAR OU REINICIAR O JOGO
        function iniciarPuzzle(caminhoImagem) {
            // Esconder vitória anterior
            document.getElementById('mensagem-vitoria').style.display = 'none';
            
            // Remover peças antigas se existirem
            const pecasAntigas = document.querySelectorAll('.peca');
            pecasAntigas.forEach(peca => peca.remove());
            
            pecasEncaixadas = 0;

            // Mostrar contentor e criar novas peças
            document.getElementById('escala-wrap').style.display = 'block';
            document.getElementById('jogo-container').style.display = 'block';
            ajustarEscalaPuzzle();
            criarPecas(caminhoImagem);
            
            // Ativar controlos apenas na primeira vez
            if (!magnetismoAtivado) {
                ativarMagnetismo();
                magnetismoAtivado = true;
            }
        }

        // 3. CRIAR PEÇAS E ESPALHÁ-LAS
        function criarPecas(caminhoImagem) {
            const container = document.getElementById('jogo-container');

            for (let c = 0; c < colunas; c++) {
                for (let l = 0; l < linhas; l++) {
                    let peca = document.createElement('div');
                    peca.className = 'peca';
                    
                    // Definir imagem de fundo
                    peca.style.backgroundImage = `url('${caminhoImagem}')`;
                    
                    // Calcular que parte da imagem esta peça mostra
                    let fundoX = -(c * larguraPeca);
                    let fundoY = -(l * alturaPeca);
                    peca.style.backgroundPosition = `${fundoX}px ${fundoY}px`;
                    
                    // GUARDAR DESTINO (Cálculo atualizado com base nas CSS)
                    // No CSS, #molde-tabuleiro está em right:30px.
                    // O contentor tem 1330px. O molde começa em 1330 - 30 - 880 = 420px de left.
                    peca.destinoX = 420 + (c * larguraPeca);
                    peca.destinoY = 30 + (l * alturaPeca);

                    // POSIÇÃO INICIAL ALEATÓRIA (na zona-pecas à esquerda)
                    // Zona-pecas está em left:20, width:380.
                    let inicioX = 20 + Math.random() * (380 - larguraPeca);
                    let inicioY = 30 + Math.random() * (660 - alturaPeca);
                    
                    peca.style.left = inicioX + 'px';
                    peca.style.top = inicioY + 'px';
                    
                    // Propriedades de estado da peça
                    peca.bloqueada = false;
                    container.appendChild(peca);
                }
            }
        }

        // 4. LÓGICA DE ARRASTAR E "MAGNETISMO" (Unificada)
        function ativarMagnetismo() {
            let pecaArrastada = null;
            let deslizeX = 0, deslizeY = 0;

            // --- Eventos Unificados (Pointer Events) para Rato e Toque ---

            document.addEventListener('pointerdown', function(e) {
                // Se clicámos numa peça e ela não está bloqueada
                if (e.target.classList.contains('peca') && !e.target.bloqueada) {
                    pecaArrastada = e.target;
                    pecaArrastada.style.zIndex = 100; // Trazer para a frente
                    
                    let caixa = pecaArrastada.getBoundingClientRect();
                    // Calcular onde o dedo/rato tocou *dentro* da peça (compensando escala)
                    deslizeX = (e.clientX - caixa.left) / escalaJogo;
                    deslizeY = (e.clientY - caixa.top) / escalaJogo;
                    
                    pecaArrastada.setPointerCapture(e.pointerId); // Garante que o movimento é capturado
                    e.preventDefault();
                }
            });

            document.addEventListener('pointermove', function(e) {
                if (pecaArrastada) {
                    let caixaJogo = document.getElementById('jogo-container').getBoundingClientRect();
                    
                    // Calcular nova posição relativa ao contentor do jogo (compensando escala)
                    let novoX = ((e.clientX - caixaJogo.left) / escalaJogo) - deslizeX;
                    let novoY = ((e.clientY - caixaJogo.top) / escalaJogo) - deslizeY;
                    
                    pecaArrastada.style.left = novoX + 'px';
                    pecaArrastada.style.top = novoY + 'px';
                }
            });

            document.addEventListener('pointerup', function(e) {
                if (pecaArrastada) {
                    verificarEncaixe(pecaArrastada);
                    pecaArrastada = null;
                }
            });

            // Função que verifica se a peça está perto do destino
            function verificarEncaixe(peca) {
                let posAtualX = parseInt(peca.style.left);
                let posAtualY = parseInt(peca.style.top);
                
                // Distância entre posição atual e destino
                let distanciaX = Math.abs(posAtualX - peca.destinoX);
                let distanciaY = Math.abs(posAtualY - peca.destinoY);
                
                // RAIO DE MAGNETISMO (50px para peças maiores)
                if (distanciaX < 50 && distanciaY < 50) {
                    // Encaixar perfeitamente
                    peca.style.left = peca.destinoX + 'px';
                    peca.style.top = peca.destinoY + 'px';
                    peca.style.border = "none"; // Remover borda branca
                    peca.style.zIndex = 1;      // Enviar para trás
                    peca.bloqueada = true;      // Impedir novos arrastos
                    peca.style.cursor = "default";
                    
                    pecasEncaixadas++;
                    
                    // Verificar Vitória
                    if (pecasEncaixadas === totalPecas) {
                        let mensagemVitoria = document.getElementById('mensagem-vitoria');
                        mensagemVitoria.style.display = 'block';
                        
                        // Esconder mensagem após 4 segundos
                        setTimeout(function() {
                            mensagemVitoria.style.display = 'none';
                        }, 4000);
                    }
                } else {
                    // Se não encaixou, volta ao z-index normal
                    peca.style.zIndex = 10;
                }
            }
        }
    </script>
</body>
</html>
