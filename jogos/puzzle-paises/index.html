<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALEGA - Puzzle Mundial de Países</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .container { background-color: #1e293b; border-radius: 12px; padding: 30px; width: 90%; max-width: 650px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); text-align: center; border: 2px solid #0284c7; }
        h1 { color: #38bdf8; margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #94a3b8; margin-bottom: 20px; font-size: 1rem; }
        
        .card-jogo { background-color: #0f172a; border: 2px solid #334155; border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        .bandeira-pais { font-size: 4rem; margin-bottom: 15px; }
        .dica-texto { font-size: 1.1rem; color: #f1f5f9; margin-bottom: 10px; font-weight: bold; }

        .opcoes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-opcao { background-color: #334155; color: white; border: 1px solid #475569; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-opcao:hover { background-color: #0284c7; border-color: #38bdf8; }

        .info-painel { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.95rem; color: #94a3b8; border-top: 1px solid #334155; padding-top: 15px; }
        .btn-voltar { margin-top: 20px; background-color: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-voltar:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🗺️ MALEGA - Puzzle Mundial de Países</h1>
        <p>Teste os seus conhecimentos com países dos cinco continentes!</p>

        <div class="card-jogo" id="cardJogo">
            <div id="bandeiraContainer" class="bandeira-pais">🇵🇹</div>
            <div id="dicaContainer" class="dica-texto">Capital: Lisboa</div>
        </div>

        <div id="opcoesContainer" class="opcoes-grid">
            <!-- Botões gerados automaticamente -->
        </div>

        <div class="info-painel">
            <span id="pontuacaoTexto">Pontuação: 0</span>
            <span id="perguntaTexto">Pergunta 1 de 15</span>
        </div>

        <button class="btn-voltar" onclick="location.reload()">🔄 Reiniciar Jogo</button>
    </div>

    <script>
        const paisesMundo = [
            { nome: "Portugal", bandeira: "🇵🇹", pista: "Capital: Lisboa (Europa)" },
            { nome: "Espanha", bandeira: "🇪🇸", pista: "Capital: Madrid (Europa)" },
            { nome: "França", bandeira: "🇫🇷", pista: "Capital: Paris (Europa)" },
            { nome: "Itália", bandeira: "🇮🇹", pista: "Capital: Roma (Europa)" },
            { nome: "Alemanha", bandeira: "🇩🇪", pista: "Capital: Berlim (Europa)" },
            { nome: "Reino Unido", bandeira: "🇬🇧", pista: "Capital: Londres (Europa)" },
            { nome: "Suíça", bandeira: "🇨🇭", pista: "Capital: Berna (Europa)" },
            { nome: "Países Baixos", bandeira: "🇳🇱", pista: "Capital: Amesterdão (Europa)" },
            { nome: "Bélgica", bandeira: "🇧🇪", pista: "Capital: Bruxelas (Europa)" },
            { nome: "Suécia", bandeira: "🇸🇪", pista: "Capital: Estocolmo (Europa)" },
            { nome: "Noruega", bandeira: "🇳🇴", pista: "Capital: Oslo (Europa)" },
            { nome: "Dinamarca", bandeira: "🇩🇰", pista: "Capital: Copenhaga (Europa)" },
            { nome: "Polónia", bandeira: "🇵🇱", pista: "Capital: Varsóvia (Europa)" },
            { nome: "Grécia", bandeira: "🇬🇷", pista: "Capital: Atenas (Europa)" },
            { nome: "Rússia", bandeira: "🇷🇺", pista: "Capital: Moscovo (Europa/Ásia)" },
            { nome: "Brasil", bandeira: "🇧🇷", pista: "Capital: Brasília (América do Sul)" },
            { nome: "Estados Unidos", bandeira: "🇺🇸", pista: "Capital: Washington D.C. (América do Norte)" },
            { nome: "Canadá", bandeira: "🇨🇦", pista: "Capital: Otava (América do Norte)" },
            { nome: "Argentina", bandeira: "🇦🇷", pista: "Capital: Buenos Aires (América do Sul)" },
            { nome: "México", bandeira: "🇲🇽", pista: "Capital: Cidade do México (América do Norte)" },
            { nome: "Japão", bandeira: "🇯🇵", pista: "Capital: Tóquio (Ásia)" },
            { nome: "China", bandeira: "🇨🇳", pista: "Capital: Pequim (Ásia)" },
            { nome: "Índia", bandeira: "🇮🇳", pista: "Capital: Nova Deli (Ásia)" },
            { nome: "Coreia do Sul", bandeira: "🇰🇷", pista: "Capital: Seul (Ásia)" },
            { nome: "Tailândia", bandeira: "🇹🇭", pista: "Capital: Banguecoque (Ásia)" },
            { nome: "Austrália", bandeira: "🇦🇺", pista: "Capital: Camberra (Oceania)" },
            { nome: "Nova Zelândia", bandeira: "🇳🇿", pista: "Capital: Wellington (Oceania)" },
            { nome: "Egito", bandeira: "🇪🇬", pista: "Capital: Cairo (África)" },
            { nome: "África do Sul", bandeira: "🇿🇦", pista: "Capital: Pretória / Cidade do Cabo (África)" },
            { nome: "Marrocos", bandeira: "🇲🇦", pista: "Capital: Rabat (África)" }
        ];

        let indiceAtual = 0;
        let pontuacao = 0;
        let listaMisturada = [];
        const totalPerguntas = 15; // Jogo de 15 perguntas aleatórias por cada ronda

        function iniciarJogo() {
            listaMisturada = [...paisesMundo].sort(() => Math.random() - 0.5).slice(0, totalPerguntas);
            indiceAtual = 0;
            pontuacao = 0;
            carregarPergunta();
        }

        function carregarPergunta() {
            if (indiceAtual >= listaMisturada.length) {
                document.getElementById('cardJogo').style.display = 'none';
                document.getElementById('opcoesContainer').innerHTML = `<h2 style="color: #38bdf8; grid-column: span 2; padding: 20px;">🏆 Jogo Concluído!<br>Pontuação Final: ${pontuacao} / ${totalPerguntas}</h2>`;
                document.getElementById('perguntaTexto').innerText = "Fim do Jogo";
                return;
            }

            const atual = listaMisturada[indiceAtual];
            document.getElementById('bandeiraContainer').innerText = atual.bandeira;
            document.getElementById('dicaContainer').innerText = atual.pista;
            document.getElementById('pontuacaoTexto').innerText = `Pontuação: ${pontuacao}`;
            document.getElementById('perguntaTexto').innerText = `Pergunta ${indiceAtual + 1} de ${totalPerguntas}`;

            let opcoes = [atual.nome];
            while (opcoes.length < 4) {
                let aleatorio = paisesMundo[Math.floor(Math.random() * paisesMundo.length)].nome;
                if (!opcoes.includes(aleatorio)) {
                    opcoes.push(aleatorio);
                }
            }
            opcoes.sort(() => Math.random() - 0.5);

            const containerOpcoes = document.getElementById('opcoesContainer');
            containerOpcoes.innerHTML = '';

            opcoes.forEach(opcao => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcao';
                btn.innerText = opcao;
                btn.onclick = () => verificarResposta(opcao, atual.nome);
                containerOpcoes.appendChild(btn);
            });
        }

        function verificarResposta(escolha, correta) {
            if (escolha === correta) {
                pontuacao++;
            }
            indiceAtual++;
            carregarPergunta();
        }

        iniciarJogo();
    </script>
</body>
</html>
