<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aventura Pirata: Caça ao Tesouro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            border: 4px solid #5d4037;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: #1a4d3a;
            max-width: 95vw;
        }

        canvas {
            display: block;
            border-radius: 10px;
            background-color: #1a4d3a;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            pointer-events: none;
        }

        #msg-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 15px;
            display: none;
            width: 80%;
            z-index: 10;
        }

        button.btn-reset {
            padding: 12px 24px;
            font-size: 18px;
            background: #ff9800;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* Controlo Tátil para Telemóveis */
        #touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90vw;
            max-width: 400px;
            margin-top: 15px;
            user-select: none;
        }

        .d-pad, .action-pad {
            display: grid;
            gap: 8px;
        }

        .d-pad {
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
        }

        .btn-touch {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #5d4037;
            border-radius: 10px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .btn-touch:active {
            background: #ff9800;
            color: white;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">💰 Tesouros: <span id="score">0</span></div>
        <div id="msg-overlay">
            <h2 id="status-text">Fim de Jogo!</h2>
            <p>O barco bateu numa rocha!</p>
            <button class="btn-reset" onclick="resetGame()">Jogar Novamente</button>
        </div>
        <canvas id="gameCanvas" width="360" height="480"></canvas>
    </div>

    <!-- Botões Virtuais para Telemóvel -->
    <div id="touch-controls">
        <div class="d-pad">
            <div class="btn-touch btn-up" id="btnUp">⬆️</div>
            <div class="btn-touch btn-left" id="btnLeft">⬅️</div>
            <div class="btn-touch btn-down" id="btnDown">⬇️</div>
            <div class="btn-touch btn-right" id="btnRight">➡️</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('msg-overlay');
        const statusText = document.getElementById('status-text');

        let score = 0;
        let gameActive = true;
        let gameSpeed = 1;

        const player = {
            x: 140,
            y: 380,
            width: 50,
            height: 50,
            speed: 4,
            emoji: "⛵"
        };

        let items = [];
        const keys = {};

        // Controlos Teclado
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Controlos Táteis (Telemóvel)
        function bindTouch(elementId, keyName) {
            const btn = document.getElementById(elementId);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
        }

        bindTouch('btnUp', 'ArrowUp');
        bindTouch('btnDown', 'ArrowDown');
        bindTouch('btnLeft', 'ArrowLeft');
        bindTouch('btnRight', 'ArrowRight');

        function spawnItem() {
            const types = ['💰', '💎', '🪨'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            items.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                type: type,
                speed: (Math.random() * 2 + 1.5) * gameSpeed,
                size: 35
            });
        }

        function update() {
            if (!gameActive) return;

            // Movimentação do Barco
            if ((keys['ArrowUp'] || keys['w']) && player.y > 10) player.y -= player.speed;
            if ((keys['ArrowDown'] || keys['s']) && player.y < canvas.height - player.height) player.y += player.speed;
            if ((keys['ArrowLeft'] || keys['a']) && player.x > 10) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['d']) && player.x < canvas.width - player.width) player.x += player.speed;

            // Atualização de Objetos Caindo
            items.forEach((item, index) => {
                item.y += item.speed;

                // Colisão
                if (
                    player.x < item.x + item.size &&
                    player.x + player.width > item.x &&
                    player.y < item.y + item.size &&
                    player.y + player.height > item.y
                ) {
                    handleCollision(item, index);
                }

                if (item.y > canvas.height + 40) items.splice(index, 1);
            });

            if (Math.random() < 0.03) spawnItem();

            draw();
            requestAnimationFrame(update);
        }

        function handleCollision(item, index) {
            if (item.type === '🪨') {
                gameActive = false;
                statusText.innerText = "Oh No! Bateu numa rocha!";
                overlay.style.display = 'block';
            } else {
                score += 10;
                scoreElement.innerText = score;
                items.splice(index, 1);
                gameSpeed += 0.01;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Itens
            items.forEach(item => {
                ctx.font = "32px Arial";
                ctx.fillText(item.type, item.x, item.y);
            });

            // Barco
            ctx.font = "45px Arial";
            ctx.fillText(player.emoji, player.x, player.y + 40);
        }

        function resetGame() {
            score = 0;
            gameSpeed = 1;
            items = [];
            player.x = 140;
            player.y = 380;
            scoreElement.innerText = "0";
            gameActive = true;
            overlay.style.display = 'none';
            update();
        }

        window.onload = () => update();
    </script>
</body>
</html>
