<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz de Portugal</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #eff6ff;
      color: #1e3a8a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 2px solid #bfdbfe;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(30, 58, 138, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 15px;
      color: #2563eb;
    }
    .question {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.35;
      color: #0f172a;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      min-height: 52px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .opt-btn.ok { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .opt-btn.err { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }
    .next-btn {
      min-height: 50px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span id="progress">Pergunta 1 / 8</span>
      <span>Pontos: <strong id="score">0</strong></span>
    </div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <button id="btnNext" class="next-btn" style="display:none;">Próxima Pergunta ➡️</button>
  </div>

  <script>
    const QUESTIONS = [
      { q: 'Qual é o rio que desagua em Lisboa?', opts: ['Rio Douro', 'Rio Tejo', 'Rio Mondego', 'Rio Guadiana'], ans: 1 },
      { q: 'Em que região fica a cidade de Faro?', opts: ['Alentejo', 'Minho', 'Algarve', 'Ribatejo'], ans: 2 },
      { q: 'Qual é o ponto mais alto de Portugal Continental?', opts: ['Serra da Estrela (Torre)', 'Serra do Gerês', 'Serra de Sintra', 'Serra de Monchique'], ans: 0 },
      { q: 'Qual é a capital do arquipélago da Madeira?', opts: ['Ponta Delgada', 'Funchal', 'Angra do Heroísmo', 'Horta'], ans: 1 },
      { q: 'Qual destes rios passa pela cidade de Coimbra?', opts: ['Rio Sado', 'Rio Lima', 'Rio Mondego', 'Rio Ave'], ans: 2 },
      { q: 'Qual é a maior ilha do arquipélago dos Açores?', opts: ['Terceira', 'Pico', 'Faial', 'São Miguel'], ans: 3 },
      { q: 'Que cidade é conhecida como a "Invicta"?', opts: ['Braga', 'Porto', 'Aveiro', 'Évora'], ans: 1 },
      { q: 'Em que distrito fica a cidade de Évora?', opts: ['Beja', 'Portalegre', 'Évora', 'Setúbal'], ans: 2 }
    ];

    let idx = 0;
    let score = 0;
    let answered = false;

    const progressEl = document.getElementById('progress');
    const scoreEl = document.getElementById('score');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const btnNext = document.getElementById('btnNext');

    function render() {
      if (idx >= QUESTIONS.length) {
        progressEl.textContent = 'Fim do Quiz!';
        questionEl.textContent = `🇵🇹 Acertou ${score} de ${QUESTIONS.length} perguntas!`;
        optionsEl.innerHTML = '';
        btnNext.textContent = '↺ Jogar Novamente';
        btnNext.style.display = 'block';
        btnNext.onclick = () => { idx = 0; score = 0; scoreEl.textContent = '0'; render(); };
        return;
      }

      answered = false;
      const item = QUESTIONS[idx];
      progressEl.textContent = `Pergunta ${idx + 1} / ${QUESTIONS.length}`;
      questionEl.textContent = item.q;
      optionsEl.innerHTML = '';
      btnNext.style.display = 'none';
      btnNext.textContent = 'Próxima Pergunta ➡️';
      btnNext.onclick = () => { idx++; render(); };

      item.opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          if (answered) return;
          answered = true;
          const allBtns = optionsEl.querySelectorAll('.opt-btn');
          allBtns[item.ans].classList.add('ok');
          if (i === item.ans) {
            score++;
            scoreEl.textContent = String(score);
          } else {
            btn.classList.add('err');
          }
          btnNext.style.display = 'block';
        });
        optionsEl.appendChild(btn);
      });
    }

    render();
  </script>
</body>
</html>
