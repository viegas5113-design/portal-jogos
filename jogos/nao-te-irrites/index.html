<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Não Te Irrites do Avô</title>
    <style>
        body {
            background-color: #ecf0f1;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            touch-action: none; /* Mantém o ecrã firme nos tablets */
            user-select: none;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 34px; }
        p { font-size: 16px; margin-top: 0; color: #7f8c8d; margin-bottom: 20px; }
        
        #area-jogo {
            position: relative;
            width: 600px;
            height: 600px;
            margin: 0 auto;
            background-color: white;
            border: 5px solid #2c3e50;
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }

        /* O Tabuleiro Pintado */
        #tabuleiro {
            border-radius: 10px;
        }

        /* Os Berlindes (Pinos) */
        .pino {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: grab;
            z-index: 10;
            /* O Sombreamento para dar o efeito de bola 3D */
            box-shadow: 2px 4px 6px rgba(0,0,0,0.4), inset -5px -5px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .pino:active {
            cursor: grabbing;
            transform: scale(1.2); /* Fica maior quando se pega nele */
            z-index: 100;
        }

        /* Cores de Luxo para os Pinos */
        .pino-vermelho { background: radial-gradient(circle at 10px 10px, #ff7675, #d63031); }
        .pino-verde    { background: radial-gradient(circle at 10px 10px, #55efc4, #00b894); }
        .pino-azul     { background: radial-gradient(circle at 10px 10px, #74b9ff, #0984e3); }
        .pino-amarelo  { background: radial-gradient(circle at 10px 10px, #ffeaa7, #fdcb6e); }

        /* Painel do Dado */
        #painel-dado {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        #caixa-dado {
            font-size: 50px;
            width: 80px;
            height: 80px;
            background-color: white;
            border: 4px solid #2c3e50;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #2c3e50;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }
        .dado-animacao {
            animation: tremer 0.4s infinite;
        }
        @keyframes tremer {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-15deg); }
            100% { transform: rotate(0deg); }
        }
        button {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        button:hover { background-color: #34495e; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }

    </style>
</head>
<body>

    <h1>Não Te Irrites 🎲</h1>
    <p>Lança o dado e arrasta os teus pinos livremente pelo caminho!</p>

    <div id="area-jogo">
        <canvas id="tabuleiro" width="600" height="600"></canvas>
        <!-- Os pinos serão gerados aqui dentro pelo motor do jogo -->
    </div>

    <div id="painel-dado">
        <div id="caixa-dado">🎲</div>
        <button id="btn-dado" onclick="lancarDado()">Lançar o Dado</button>
    </div>

    <script>
        // ==========================================
        // 1. O PINTOR DO TABULEIRO (Desenha as cores)
        // ==========================================
        const ctx = document.getElementById('tabuleiro').getContext('2d');
        const tam = 40; // Tamanho de cada quadrado do caminho

        // Pinta a base de branco
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, 600, 600);

        // Desenha a rede do caminho (riscas cinzentas)
        ctx.strokeStyle = '#bdc3c7';
        for(let i=0; i<15; i++){
            for(let j=0; j<15; j++){
                ctx.strokeRect(i*tam, j*tam, tam, tam);
            }
        }

        // As 4 cores clássicas do jogo
        const cVermelho = '#e74c3c';
        const cVerde    = '#2ecc71';
        const cAzul     = '#3498db';
        const cAmarelo  = '#f1c40f';

        // Função que pinta as "Casas" (Bases) nos 4 cantos
        function desenhaBase(x, y, cor) {
            ctx.fillStyle = cor;
            ctx.fillRect(x*tam, y*tam, 6*tam, 6*tam);
            ctx.fillStyle = 'white';
            ctx.fillRect((x+1)*tam, (y+1)*tam, 4*tam, 4*tam);
            
            // Desenha as 4 covinhas onde os pinos descansam
            ctx.fillStyle = cor;
            const pos = [[2,2], [4,2], [2,4], [4,4]];
            pos.forEach(p => {
                ctx.beginPath();
                ctx.arc((x+p[0])*tam - tam/2, (y+p[1])*tam - tam/2, 15, 0, Math.PI*2);
                ctx.fill();
            });
        }

        // Pintar os 4 cantos principais
        desenhaBase(0, 0, cVermelho); 
        desenhaBase(9, 0, cVerde);    
        desenhaBase(0, 9, cAzul);     
        desenhaBase(9, 9, cAmarelo);  

        // Pintar os Caminhos Finais até ao Centro (Retas coloridas)
        ctx.fillStyle = cVermelho; ctx.fillRect(1*tam, 7*tam, 5*tam, tam);
        ctx.fillStyle = cVerde;    ctx.fillRect(7*tam, 1*tam, tam, 5*tam);
        ctx.fillStyle = cAzul;     ctx.fillRect(7*tam, 9*tam, tam, 5*tam);
        ctx.fillStyle = cAmarelo;  ctx.fillRect(9*tam, 7*tam, 5*tam, tam);

        // Pintar a Casa de Saída de cada cor (onde o pino começa a viagem)
        ctx.fillStyle = cVermelho; ctx.fillRect(1*tam, 6*tam, tam, tam);
        ctx.fillStyle = cVerde;    ctx.fillRect(8*tam, 1*tam, tam, tam);
        ctx.fillStyle = cAzul;     ctx.fillRect(6*tam, 13*tam, tam, tam);
        ctx.fillStyle = cAmarelo;  ctx.fillRect(13*tam, 8*tam, tam, tam);

        // Pintar o Grande Triângulo do Centro (Meta Final)
        ctx.beginPath(); ctx.moveTo(6*tam, 6*tam); ctx.lineTo(9*tam, 6*tam); ctx.lineTo(7.5*tam, 7.5*tam); ctx.fillStyle = cVerde; ctx.fill();
        ctx.beginPath(); ctx.moveTo(9*tam, 6*tam); ctx.lineTo(9*tam, 9*tam); ctx.lineTo(7.5*tam, 7.5*tam); ctx.fillStyle = cAmarelo; ctx.fill();
        ctx.beginPath(); ctx.moveTo(6*tam, 9*tam); ctx.lineTo(9*tam, 9*tam); ctx.lineTo(7.5*tam, 7.5*tam); ctx.fillStyle = cAzul; ctx.fill();
        ctx.beginPath(); ctx.moveTo(6*tam, 6*tam); ctx.lineTo(6*tam, 9*tam); ctx.lineTo(7.5*tam, 7.5*tam); ctx.fillStyle = cVermelho; ctx.fill();

        // ==========================================
        // 2. FÁBRICA DOS BERLINDES (Criar os Pinos)
        // ==========================================
        const areaJogo = document.getElementById('area-jogo');

        function criarPinosDaCor(nomeCor, inicioX, inicioY) {
            const posicoesCovinhas = [[1.5, 1.5], [3.5, 1.5], [1.5, 3.5], [3.5, 3.5]];
            
            for(let i = 0; i < 4; i++) {
                let pino = document.createElement('div');
                pino.className = `pino pino-${nomeCor}`;
                
                // Coloca o pino na sua covinha exata dentro da base
                let pinoX = (inicioX + posicoesCovinhas[i][0]) * tam - 15;
                let pinoY = (inicioY + posicoesCovinhas[i][1]) * tam - 15;
                
                pino.style.left = pinoX + 'px';
                pino.style.top = pinoY + 'px';
                
                areaJogo.appendChild(pino);
            }
        }

        // Colocar os pinos nas suas casas iniciais
        criarPinosDaCor('vermelho', 0, 0);
        criarPinosDaCor('verde', 9, 0);
        criarPinosDaCor('azul', 0, 9);
        criarPinosDaCor('amarelo', 9, 9);

        // ==========================================
        // 3. MOTOR DE ARRASTAR LIVRE (A Mão do Jogador)
        // ==========================================
        let pecaArrastada = null;
        let deslizeX = 0, deslizeY = 0;

        document.addEventListener('pointerdown', function(e) {
            if (e.target.classList.contains('pino')) {
                pecaArrastada = e.target;
                
                // Puxar o pino para a frente de todos
                const todosPinos = document.querySelectorAll('.pino');
                todosPinos.forEach(p => p.style.zIndex = 10);
                pecaArrastada.style.zIndex = 100;
                
                let caixa = pecaArrastada.getBoundingClientRect();
                deslizeX = e.clientX - caixa.left;
                deslizeY = e.clientY - caixa.top;
                e.preventDefault(); // Evita que o tablet role a página sem querer
            }
        });

        document.addEventListener('pointermove', function(e) {
            if (pecaArrastada) {
                let caixaJogo = areaJogo.getBoundingClientRect();
                
                // Calcular onde a mão está a levar o pino
                let novoX = (e.clientX - caixaJogo.left) - deslizeX;
                let novoY = (e.clientY - caixaJogo.top) - deslizeY;
                
                // Evitar que o pino fuja do tabuleiro de jogo
                if(novoX < 0) novoX = 0;
                if(novoX > 570) novoX = 570;
                if(novoY < 0) novoY = 0;
                if(novoY > 570) novoY = 570;

                pecaArrastada.style.left = novoX + 'px';
                pecaArrastada.style.top = novoY + 'px';
            }
        });

        document.addEventListener('pointerup', function(e) {
            if (pecaArrastada) {
                // Ao contrário do puzzle, aqui não há íman rígido. 
                // Larga-se a peça na casa onde a contagem parou!
                pecaArrastada = null;
            }
        });

        // ==========================================
        // 4. MOTOR DO DADO (A Sorte)
        // ==========================================
        const caixaDado = document.getElementById('caixa-dado');
        const btnDado = document.getElementById('btn-dado');

        function lancarDado() {
            btnDado.disabled = true; // Desliga o botão para não clicarem duas vezes rápido
            caixaDado.classList.add('dado-animacao');
            
            // Faz o dado "rolar" visualmente passando números ao calhas
            let tempo = 0;
            let baralhar = setInterval(() => {
                caixaDado.innerText = Math.floor(Math.random() * 6) + 1;
                tempo += 50;
                if (tempo > 500) {
                    clearInterval(baralhar);
                    caixaDado.classList.remove('dado-animacao');
                    
                    // Número Final e Oficial
                    let resultado = Math.floor(Math.random() * 6) + 1;
                    caixaDado.innerText = resultado;
                    btnDado.disabled = false;
                }
            }, 50);
        }
    </script>
</body>
</html>
